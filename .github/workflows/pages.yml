name: Deploy EduPlan Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eduplan-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install verified dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Build and test browser flows
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E desktop + mobile
        run: npm run test:e2e
      - name: Build GitHub Pages user-site version
        run: npm run build
      - name: Check static output and path
        run: |
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/build-info.json
          grep -q '/assets/' dist/index.html
          if grep -q '/eduplan-oss/' dist/index.html; then echo 'Wrong project-site base path' >&2; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
